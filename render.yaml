# Render Blueprint: one web service running the Docker image above.
# Set the three secrets in the Render dashboard after the first deploy.
services:
  - type: web
    name: rehearse
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
